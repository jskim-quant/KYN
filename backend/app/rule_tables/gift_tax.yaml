# 출처: 기존 KYN(Next.js) lib/tax/policy.ts에서 이미 검증·운영 중인 값을 이전.
# effective_from은 현행 5구간 누진세율 구조가 도입된 시점을 참고값으로 기재했으나
# 정확한 시행일은 세무사 확인이 필요하다 (status: pending_review로 표시한 항목 참고).
#
# 값 변경 시 이 파일만 수정하면 전체 반영된다 — 코드에 세율을 하드코딩하지 않는다.

