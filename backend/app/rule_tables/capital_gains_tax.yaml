- rule_id: cgt-one-house-exemption
  jurisdiction: KR
  tax_type: cgt
  rule_name: 1세대1주택_비과세
  effective_from: "2024-01-01"
  legal_basis:
    - statute: 소득세법
      article: "§89"
  parameters:
    exempt_limit: 12.0                 # 양도가액 12억 이하 전액 비과세
    min_holding_years: 2
    lthd_10yr_rate: 0.80                # 보유+거주 4%+4%, 10년 이상 최대
    lthd_5yr_rate: 0.40
    lthd_below_5yr_rate: 0.24
    basic_deduction: 0.025
    unit: "억원"
  status: pending_review
  reviewed_at: null
  reviewed_by: null

